name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Start dev server
        run: npm run dev &

      - name: Wait for dev server
        run: |
          timeout 30 bash -c 'until curl -sf http://localhost:9000 > /dev/null; do sleep 1; done'

      - name: E2E tests
        run: npm run test:e2e
        env:
          CI: true
          E2E_URL: http://localhost:9000
