name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Cache Puppeteer Chromium
        uses: actions/cache@v5
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Start dev server
        run: npm run dev &

      - name: Wait for dev server
        run: |
          timeout 30 bash -c 'until curl -sf http://localhost:9000 > /dev/null; do sleep 1; done'

      - name: E2E tests
        run: npm run test:e2e
        env:
          CI: true
          E2E_URL: http://localhost:9000

      - name: Visual regression tests
        run: npm run test:visual
        env:
          CI: true
          E2E_URL: http://localhost:9000

      - name: Upload visual diff artifacts
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: visual-diffs
          path: screenshots/diff/
